<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://ufisfakmsaiicetlzjal.supabase.co wss://ufisfakmsaiicetlzjal.supabase.co;">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

  <title>Clicker Kingdom</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" rel="preload" as="script">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
</head>
<body>
  <div id="viewLanding" class="view">
    <div class="landing-hero">
      <h1 class="landing-title">👑 CLICKER KINGDOM</h1>
      <p class="landing-subtitle">탭 한 번으로 세워지는 나만의 제국</p>
      <div class="landing-buttons">
        <button id="landingNewGameBtn">⚔️ 신규 게임</button>
        <button id="landingContinueBtn" style="display:none;">📜 이어하기</button>
        <button id="landingCloudBtn">☁ 클라우드 진단</button>
      </div>
      <div id="landingCloudStatus" class="cloud-status" style="margin-top: 10px; font-size: 12px;"></div>
    </div>
  </div>

  <div id="viewClicker" class="view" hidden>
    <div id="topbar">
      <span id="topbarUser"></span>
      <span id="topbarClicks">0</span>
      <span id="topbarActions"></span>
    </div>
    <div id="cloudStatus" class="cloud-status"></div>

    <div id="viewContainer">
      <div id="viewClickerMain">
        <div id="clickerPanel" class="panel">
          <div id="clickerSeal">
            <div id="sealGlow"></div>
            <div id="sealInner">🛡️</div>
            <button id="sealBtn">👆</button>
          </div>
          <div id="cpsDisplay">0 / 초</div>
        </div>

        <div id="progressPanel" class="panel">
          <div class="panel-title">⭐ 성장</div>
          <div id="progressBars">
            <div class="progress-row" data-progress="clicks">
              <span class="progress-label">탭</span>
              <span class="progress-track"><span class="progress-fill" id="progressClicksFill"></span></span>
              <span class="progress-count" id="progressClicksCount">0</span>
            </div>
            <div class="progress-row" data-progress="armies">
              <span class="progress-label">군대</span>
              <span class="progress-track"><span class="progress-fill" id="progressArmiesFill"></span></span>
              <span class="progress-count" id="progressArmiesCount">0</span>
            </div>
            <div class="progress-row" data-progress="battles">
              <span class="progress-label">전투</span>
              <span class="progress-track"><span class="progress-fill" id="progressBattlesFill"></span></span>
              <span class="progress-count" id="progressBattlesCount">0</span>
            </div>
          </div>
        </div>
        <div id="missionsPanel" class="panel" hidden>
          <div class="panel-title">🎯 임무</div>
          <div id="missionsList"></div>
        </div>

        <div id="relicPanel" class="panel">
          <div class="panel-title">🏺 유물</div>
          <div id="relicList"></div>
        </div>
      </div>

      <div id="viewArmy">
        <div id="armyPanel" class="panel">
          <div class="panel-title">⚔️ 군대</div>
          <div class="panel-desc">클릭으로 군대를 모아 전투력을 높이세요</div>
          <div id="armyList"></div>
          <div id="battlePanel">
            <div class="panel-title">🏴 전쟁</div>
            <div id="battleEnemyInfo"></div>
            <div id="battleActionBtns">
              <button id="attackBtn">⚔️ 침략!</button>
              <button id="randomAttackBtn">🎲 랜덤 매칭</button>
              <button id="friendBattleBtn">👥 친구 대전</button>
            </div>
          </div>
        </div>
        <div id="friendBattlePanel" class="panel" hidden>
          <div class="panel-title">👥 친구 대전</div>
          <div id="friendBattleTabs">
            <button id="fbCreateRoomBtn">방 만들기</button>
            <button id="fbJoinRoomBtn">방 참가</button>
          </div>
          <div id="fbRoomCodeDisplay"></div>
          <div id="fbJoinInput" hidden>
            <input id="fbJoinCode" type="text" placeholder="방 코드 입력" maxlength="6">
            <button id="fbJoinSubmit">참가</button>
          </div>
          <div id="fbRoomStatus" class="room-status"></div>
          <button id="fbLeaveBtn" hidden>방 나가기</button>
        </div>
      </div>

      <div id="viewShop">
        <div class="panel">
          <div class="panel-title">🏪 상점</div>
          <div id="shopList"></div>
        </div>
      </div>

      <div id="viewRanking">
      </div>
    </div>

    <div id="bottomNav">
      <button data-view="clicker" class="nav-btn active">🛡️<small>본진</small></button>
      <button data-view="army" class="nav-btn">⚔️<small>군대</small></button>
      <button data-view="shop" class="nav-btn">🏪<small>상점</small></button>
      <button data-view="ranking" class="nav-btn">🏆<small>명예의 전당</small></button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="authModal" hidden>
    <div class="modal-card">
      <div class="modal-tabs">
        <button class="modal-tab active" id="tabLogin">로그인</button>
        <button class="modal-tab" id="tabSignup">회원가입</button>
      </div>

      <div class="modal-welcome-text" id="authWelcomeText">다시 오신 것을 환영합니다. 황제시여</div>

      <div id="loginForm">
        <div class="field">
          <label for="loginEmail">이메일</label>
          <input id="loginEmail" type="email" autocomplete="email" placeholder="이메일 주소">
        </div>
        <div class="field">
          <label for="loginPw">비밀번호</label>
          <input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호">
        </div>
        <p class="modal-error" id="loginError" style="color: #ff9d9d; font-size: 12px;"></p>
        <button class="modal-submit" id="loginSubmit">로그인</button>
      </div>

      <div id="signupForm" hidden>
        <div class="field">
          <label for="signupNickname">닉네임</label>
          <input id="signupNickname" type="text" placeholder="명예의 전당에 표시될 이름">
        </div>
        <div class="field">
          <label for="signupEmail">이메일</label>
          <input id="signupEmail" type="email" autocomplete="email" placeholder="이메일 주소">
        </div>
        <div class="field">
          <label for="signupPw">비밀번호</label>
          <input id="signupPw" type="password" autocomplete="new-password" placeholder="비밀번호 6자 이상">
        </div>
        <div class="field">
          <label for="signupPw2">비밀번호 확인</label>
          <input id="signupPw2" type="password" autocomplete="new-password" placeholder="비밀번호 확인">
        </div>
        <p class="modal-error" id="signupError" style="color: #ff9d9d; font-size: 12px;"></p>
        <button class="modal-submit" id="signupSubmit">회원가입</button>
      </div>

      <button class="modal-close" id="authModalClose">닫기</button>
    </div>
  </div>

  <!-- Feedback Modal -->
  <div class="modal-overlay" id="feedbackModal" hidden>
    <div class="modal-card">
      <h3 style="margin: 0 0 14px; color: var(--gold-bright);">💡 버그 제보 및 아이디어 제안</h3>
      <div class="field">
        <label for="feedbackCategory">분류</label>
        <select id="feedbackCategory">
          <option value="🐛 버그 제보">🐛 버그 제보</option>
          <option value="💡 아이디어 제안">💡 아이디어 제안</option>
          <option value="⚔️ 밸런스 의견">⚔️ 밸런스 의견</option>
        </select>
      </div>
      <div class="field">
        <label for="feedbackText">내용</label>
        <textarea id="feedbackText" rows="4" placeholder="하고 싶은 말을 자유롭게 적어 주세요"></textarea>
      </div>
      <p id="feedbackError" style="color:#ff9d9d; font-size:12px;"></p>
      <button id="feedbackSubmit">제출</button>
      <button class="modal-close" id="feedbackClose">닫기</button>
    </div>
  </div>

  <!-- Battle Modal -->
  <div class="modal-overlay" id="battleModal" hidden>
    <div class="modal-card">
      <div id="battleContent">
        <h3 style="margin:0 0 8px; color:var(--gold-bright);">⚔️ 전투!</h3>
        <div id="battleTimerDisplay">30</div>
        <div id="battleFrontline">⚔️<br>👑<br>🛡️</div>
        <button id="battleTapBtn">⚔️ 공격!</button>
        <p style="color:var(--gray);font-size:11px;margin:8px 0 0;">적을 클릭해 물리치세요!</p>
        <div id="battleResult"></div>
      </div>
      <button class="modal-close" id="battleModalClose">닫기</button>
    </div>
  </div>

  <!-- Offline Harvest Modal -->
  <div class="modal-overlay" id="harvestModal" hidden>
    <div class="modal-card">
      <h3 style="margin:0 0 8px; color:var(--gold-bright);">🌙 오프라인 수확</h3>
      <div id="harvestContent">자원을 계산 중...</div>
      <button id="harvestCloseBtn">수확하기</button>
    </div>
  </div>

  <!-- Admin Panel (dev mode) -->
  <div class="modal-overlay" id="adminPanel" hidden>
    <div class="modal-card">
      <h3 style="margin: 0 0 14px; color: var(--gold-bright);">🛠️ 개발자 패널</h3>
      <div id="adminContent">
        <label for="adminDevClicks">클릭 수 설정</label>
        <div style="display:flex;gap:6px;">
          <input id="adminDevClicks" type="text" placeholder="ex) 1e15">
          <button id="adminSetClicksBtn">설정</button>
        </div>
        <label for="adminDevArmyKey">군대 추가 (키)</label>
        <div style="display:flex;gap:6px;">
          <input id="adminDevArmyKey" type="text" placeholder="army_test">
          <button id="adminAddArmyBtn">추가</button>
        </div>
        <label for="adminDevRelicKey">유물 추가 (키)</label>
        <div style="display:flex;gap:6px;">
          <input id="adminDevRelicKey" type="text" placeholder="relic_test">
          <button id="adminAddRelicBtn">추가</button>
        </div>
        <button id="adminGrantAllRelicsBtn">모든 유물 지급</button>
        <hr style="border-color:var(--border);margin:12px 0;">
        <button id="adminResetGameBtn" style="background:var(--danger);">게임 초기화</button>
      </div>
      <button class="modal-close" id="adminPanelClose">닫기</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/game-config.js"></script>
  <script src="js/supabase-sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
